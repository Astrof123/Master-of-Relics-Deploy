user root;
worker_processes  1;

events {
}

http {
    server {
        listen       80;
        server_name  masterofrelics.ru www.masterofrelics.ru;
        return 301 https://$host$request_uri;
    }
    server {
        listen       443 ssl;
        server_name  masterofrelics.ru www.masterofrelics.ru;

        location / {
            proxy_pass http://frontend:5173/;
        }

        location /api/ {
            proxy_pass http://backend:3000/;
        }

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        ssl_certificate /etc/letsencrypt/live/masterofrelics.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/masterofrelics.ru/privkey.pem;
    }
}